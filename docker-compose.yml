# Run on your Proxmox box / WSL:  docker compose up -d --build
# Drop audio into ${DATA_DIR}/inbox ; read transcripts at http://<host>:8080/
services:
  diarize-orchestrator:
    build: ./orchestrator
    image: meetily-diarize-orchestrator:latest
    container_name: diarize-orchestrator
    restart: unless-stopped
    env_file: .env
    dns: ["8.8.8.8", "1.1.1.1"]          # don't depend on a flaky host resolver
    volumes:
      - ${DATA_DIR:-./data}:/data         # inbox, outbox, done, failed, work
      - ./secrets:/secrets:ro             # SSH key for the pod tunnel (read-only)
      - ./refs:/refs:ro                   # speaker-id reference voices (gitignored)

  # Upload + serve frontend:
  #   GET  http://<host>:8080/            -> drag-and-drop upload box + transcript list
  #   GET  http://<host>:8080/view/<stem> -> interactive viewer: search + click-to-play
  #   GET  http://<host>:8080/<name>.md   -> the transcript (.json/.srt/.txt too)
  #   GET  http://<host>:8080/audio/<stem> -> archived source audio (Range-capable)
  #   PUT  http://<host>:8080/upload/<name> -> drops audio straight into inbox/
  # outbox/done are mounted read-only (can't be overwritten); only inbox/ is writable.
  diarize-fileserver:
    image: python:3.12-slim
    container_name: diarize-fileserver
    restart: unless-stopped
    command: ["python", "-u", "/app/server.py"]
    environment:
      OUTBOX_DIR: /data/outbox
      INBOX_DIR: /data/inbox
      DONE_DIR: /data/done
      PORT: "8080"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-2048}"
      AUDIO_EXTS: "${AUDIO_EXTS:-}"      # blank -> server.py's built-in default
      UPLOAD_TOKEN: "${UPLOAD_TOKEN:-}"  # set in .env to require ?token= on upload
    volumes:
      - ./fileserver/server.py:/app/server.py:ro
      - ${DATA_DIR:-./data}/outbox:/data/outbox:ro
      - ${DATA_DIR:-./data}/done:/data/done:ro
      - ${DATA_DIR:-./data}/inbox:/data/inbox
    ports:
      - "${LINKS_PORT:-8080}:8080"

  # Cost watchdog — kills an orphaned pod if the orchestrator crashes/hangs
  # (the orchestrator already idle-tears-down pods; this is the backstop).
  diarize-watchdog:
    image: meetily-diarize-orchestrator:latest
    container_name: diarize-watchdog
    restart: unless-stopped
    env_file: .env
    dns: ["8.8.8.8", "1.1.1.1"]
    command: ["python", "-u", "watchdog.py"]
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
